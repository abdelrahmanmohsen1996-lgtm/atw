/* Layout: Logic "Around the World" — watercolor world map behind a light sticky header with the ATW wordmark; one working column of white cards; flyer = shipping label, passport = stamp grid */
:root{
  --paper:#F3F6F8; --card:#FFFFFF; --ink:#0B2A3A; --muted:#566778; --line:#D6DEE6; --soft:#F2F5F8;
  --navy:#085271; --navy-ink:#FFFFFF; --accent:#E4572E; --accent-ink:#FFFFFF; --stamp:#C0392B; --ok:#1E9E4A; --warn:#C27C0E;
  --logic:#064A36; --logic-hi:#1EB44B; --bar:rgba(255,255,255,.88);
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper) url(assets/map.jpg) center top/cover fixed no-repeat;color:var(--ink);min-height:100vh;font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:20px}
header.top{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(8,82,113,.06)}
.topin{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{margin-right:auto;display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand img.clogo{height:34px;max-width:110px;object-fit:contain;border-left:1px solid var(--line);padding-left:10px}
.cbig{display:block;max-height:70px;max-width:220px;width:auto;height:auto;object-fit:contain;margin:0 auto}
.tc-top .cl{height:30px;max-width:90px;object-fit:contain}
.brand .gname{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;line-height:1.3;max-width:16ch}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
nav.tabs button:hover{border-color:var(--navy)}
nav.tabs .ts{display:none}
@media (max-width:520px){nav.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%;order:3}nav.tabs button{padding:8px 4px;font-size:13px}nav.tabs .tl{display:none}nav.tabs .ts{display:inline}}
nav.tabs button[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.mode{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--muted)}
.mode i{width:8px;height:8px;border-radius:50%;background:#7C879C;display:inline-block}
.mode.live i{background:var(--logic-hi);box-shadow:0 0 0 3px rgba(30,180,75,.22)}
.mode.demo i{background:#F59F00}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:30px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;color:var(--navy)}
h3{font-size:16px;font-weight:700}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--stamp)}
.btn.danger.armed{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input[type=file]{padding:8px}
textarea{resize:vertical;min-height:84px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.flash{border-radius:10px;padding:10px 14px;font-weight:600}
.flash.bad{background:color-mix(in srgb,var(--stamp) 14%,transparent);color:var(--stamp)}
.flash.good{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.shake,.stamp-in{animation:none!important}}
.teamcard{box-shadow:0 8px 24px rgba(8,82,113,.06);display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
.teamname{font-family:var(--display);font-weight:400;font-size:28px;text-transform:uppercase;line-height:1;margin-right:auto}
.stat{display:grid;text-align:right}
.stat b{font-family:var(--display);font-size:30px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.flyer{position:relative;background:var(--card);box-shadow:0 10px 30px rgba(8,82,113,.12);border:2px solid var(--navy);border-radius:6px;overflow:hidden}
.flyer .band{background:var(--navy);color:var(--accent-ink);display:flex;justify-content:space-between;gap:10px;padding:8px 16px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;flex-wrap:wrap}
.flyer .body{padding:20px 18px;display:grid;gap:16px}
.flyer .clue{font-size:21px;line-height:1.45;font-weight:500;max-width:62ch;white-space:pre-wrap;overflow-wrap:anywhere}
.flyer .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));border-top:2px solid var(--navy)}
.flyer .meta div{padding:8px 16px;border-right:1px solid var(--line);display:grid}
.flyer .meta div:last-child{border-right:0}
.flyer .meta b{font-family:var(--mono);font-size:14px}
.photo{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft);cursor:zoom-in;position:relative}
.photo img{display:block;width:100%;max-height:60vh;object-fit:contain}
.photo span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px}
.photo.loading{min-height:180px;display:grid;place-items:center;color:var(--muted);cursor:default}
.overlay{display:grid;gap:8px}
.ovstage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none}
.ovstage img{display:block;width:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.ovstage img.ovtop{position:absolute;inset:0;mix-blend-mode:multiply;cursor:grab;pointer-events:auto;touch-action:none;outline:2px dashed rgba(8,82,113,.55);outline-offset:-2px;background:rgba(190,220,240,.12)}
.overlay.ovfull{position:fixed;inset:0;z-index:80;background:#0B1A24;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:grid;align-content:center;justify-items:center;gap:10px}
.overlay.ovfull .ovstage{width:min(100%,calc((100vh - 110px)*16/9))}
.overlay.ovfull .row,.overlay.ovfull .ovmsg{color:#DCE7EE;width:min(100%,calc((100vh - 110px)*16/9))}
.overlay.ovfull .label{color:#9FB7C6}
.overlay.ovfull .btn:not(.primary){color:var(--ink)}
@media (orientation:portrait){.overlay.ovfull::before{content:"Turn your phone sideways for a bigger sheet ↻";color:#9FB7C6;font-size:13px}}
.ovstage.aligned{box-shadow:0 0 0 3px var(--logic-hi)}
.ovstage.aligned img.ovtop{outline-color:transparent}
.photos{display:grid;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;display:grid;gap:4px;justify-items:start}
.thumb{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(5,9,18,.92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.barcode{height:38px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px);opacity:.85;border-radius:2px}
.hint{border-left:3px solid var(--warn);padding:6px 12px;background:var(--soft);border-radius:0 8px 8px 0}
.passport{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.slot{aspect-ratio:1/1;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:8px;background:var(--soft)}
.slot.next{border-color:var(--accent);border-width:2px}
.slot .q{font-family:var(--display);font-size:38px;color:var(--line);font-weight:400}
.stampmark{width:86%;aspect-ratio:1/1;border:3px solid var(--sc,var(--stamp));border-radius:50%;color:var(--sc,var(--stamp));display:grid;place-content:center;gap:1px;transform:rotate(var(--rot,-8deg));box-shadow:inset 0 0 0 4px var(--soft),inset 0 0 0 5.5px var(--sc,var(--stamp))}
.stampmark .flag{font-size:24px;line-height:1}
.stampmark .code{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.06em;line-height:1}
.stampmark .date{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em}
.stampmark .pts{font-family:var(--mono);font-size:10px;font-weight:600}
.stamp-in{animation:thump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes thump{0%{transform:scale(1.8) rotate(var(--rot,-8deg));opacity:0}100%{transform:scale(1) rotate(var(--rot,-8deg));opacity:1}}
.board{display:grid;gap:10px}
.lb{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.lb.first{border:2px solid var(--accent)}
.lb .rank{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.lb.first .rank{color:var(--accent)}
.lb .nm{font-family:var(--display);font-weight:400;font-size:26px;text-transform:uppercase;line-height:1.05;display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
.lb .pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.lb .pip{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:12px}
.lb .pip.on{border:1.5px solid var(--stamp);background:color-mix(in srgb,var(--stamp) 10%,transparent)}
.lb .sc{font-family:var(--display);font-weight:400;font-size:42px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.lb .sc small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.tbl{overflow-x:auto}
.tracks td{padding:6px}.tracks select{padding:6px 8px;font-size:13px;min-width:120px}
.tracks td.done select{background:color-mix(in srgb,var(--ok) 16%,var(--soft));border-color:var(--ok)}
.tracks td.cur select{border:2px solid var(--accent)}
.tracks td.clash select{background:color-mix(in srgb,var(--stamp) 16%,var(--soft));border-color:var(--stamp)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.solve{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.station{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

.chip.idle{background:var(--soft);color:var(--muted)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}

.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.hero{position:relative;display:grid;justify-items:center;text-align:center;gap:6px;padding-top:6px}

.panel{box-shadow:0 1px 2px rgba(11,42,58,.04),0 8px 24px rgba(8,82,113,.06)}

.boardland{display:block;width:min(560px,100%);margin:6px auto 0;height:auto;opacity:.95}
.lb.first{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 7%,var(--card)),var(--card))}

.kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--soft);font-weight:700}

.install img{width:44px;height:44px;border-radius:10px;flex:none}

  background:linear-gradient(145deg,#FFF9EC,#F1E3BF);color:#085271;border:2px solid #F7EED6;box-shadow:inset 0 -3px 0 rgba(120,90,30,.22),0 4px 10px rgba(0,0,0,.28)}

.reveal-card .val{font-size:26px;max-width:340px;justify-content:center;text-align:center;animation:tflip 1s cubic-bezier(.2,1.4,.4,1)}
.eq-big .tile{--ts:clamp(44px,12.5vw,66px)}
.eq-big .eq-res{font-size:clamp(36px,10vw,56px)}
.eq-big .eqp{padding-block:26px}
.wonlist{display:flex;flex-wrap:wrap;gap:12px}

.sessbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:14px;padding:14px 16px;border:2px solid var(--line);background:var(--card)}

@media print{header.top,.foot,.noprint,#atw-diag{display:none!important}body{background:#fff!important}.wrap{max-width:none;padding:0}.cards{grid-template-columns:repeat(2,1fr);gap:10mm}.tcard{box-shadow:none}}

.empty .big{font-family:var(--display);font-size:26px;font-weight:400;text-transform:uppercase}

@media (max-width:520px){
  .flyer .clue{font-size:18px}
  .lb{grid-template-columns:40px 1fr auto;padding:10px 12px;gap:10px}
  .lb .rank{font-size:30px}.lb .nm{font-size:20px}.lb .sc{font-size:32px}

}

<body>
<header class="top"><div class="topin">
  <div class="brand"><img src="assets/atw-logo.png" alt="Around the World" width="130" height="34"><img id="clogo" class="clogo" alt="" hidden><span class="gname" id="brand">Logic Events</span></div>
  <nav class="tabs" id="tabs"></nav>
  <span class="mode" id="mode"><i></i>Connecting</span>
</div></header>
<main class="wrap" id="app"></main>
<footer class="foot">Powered by <img src="assets/logic-logo.png" alt="Logic Events" width="73" height="26"></footer>
<div class="guide" id="guide" hidden></div>
<div class="reveal" id="reveal" hidden data-act="closereveal"></div>
<div class="zoom" id="zoom" hidden><img id="zoomimg" alt="Clue photo, enlarged"></div>

<script type="module">
const FBV='10.12.2';
const DEF={title:'Around the World',hintCost:20,wrongPenalty:5,eqResult:'TW',eqTop:'C × C × C',eqBottom:'L + V',eqAfter:'× U',rewardMode:'letters',wordsTitle:'Our values',finalMessage:'Head back to the meeting room'};
const COLORS=['#E8590C','#1C7ED6','#2B8A3E','#AE3EC9','#C92A2A','#0C8599','#E67700','#5F3DC4'];
const S={countries:[],teams:[],progress:{},config:{...DEF},canEdit:false,mode:'connecting',ready:false,user:null,
  view:'play',myTeam:lsGet('atw-team'),pick:null,flash:null,editing:null,armed:null,justStamped:null,err:null,pendingImg:undefined,busy:false};
const IMG={}; // cache: key id@ver -> dataURL | '' | 'loading'
let api=null;

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9؀-ۿ]/g,'');
const fmtTime=t=>{try{return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
const code3=c=>(c.code||c.name||'???').slice(0,3).toUpperCase();
const arr=v=>Array.isArray(v)?v.filter(x=>x!=null):(v&&typeof v==='object'?Object.values(v):[]);

/* ================= data layer: Firebase or demo ================= */
function demoApi(){
  let store={};try{store=JSON.parse(lsGet('atw-demo')||'{}')}catch(e){}
  const subs=[];
  const at=p=>p.split('/').reduce((o,k)=>o==null?undefined:o[k],store);
  const fire=()=>{lsSet('atw-demo',JSON.stringify(store));subs.forEach(s=>s.cb(clone(at(s.p))))};
  const clone=v=>v==null?null:JSON.parse(JSON.stringify(v));
  return{
    mode:'demo',
    sub(p,cb){const s={p,cb};subs.push(s);cb(clone(at(p)));},
    async set(p,v){const ks=p.split('/');let o=store;ks.slice(0,-1).forEach(k=>{if(typeof o[k]!=='object'||o[k]==null)o[k]={};o=o[k]});
      if(v==null)delete o[ks.at(-1)];else o[ks.at(-1)]=clone(v);fire()},
    async get(p){return clone(at(p))},
    async blobGet(p){return clone(at(p))},
    async blobSet(p,v){return this.set(p,v)},
    async signIn(){S.user={email:'demo'};S.canEdit=true},async signOut(){}
  };
}
async function firebaseApi(cfg){
  const [app,d]=await Promise.all([import('./lib/firebase-app.js'),import('./lib/firebase-database.js')]);
  try{d.forceLongPolling()}catch(e){} // WebSockets are blocked on some networks; long-polling connects instantly
  const fa=app.initializeApp(cfg);const db=d.getDatabase(fa);
  // sign-in code (150 KB) loads only for organisers: when the Control room is opened or this device signed in before
  let authP=null;const loadAuth=()=>authP||(authP=import('./lib/firebase-auth.js').then(a=>{const auth=a.getAuth(fa);
    a.onAuthStateChanged(auth,u=>{S.user=u?{email:u.email}:null;S.canEdit=!!u;lsSet('atw-admin',u?'1':null);render(true)});return{a,auth}}));
  if(lsGet('atw-admin')||S.view==='control'||S.view==='cards')loadAuth();
  d.onValue(d.ref(db,'.info/connected'),s=>{S.mode=s.val()?'live':'offline';render(true)});
  return{
    mode:'live',
    sub(p,cb){d.onValue(d.ref(db,p),s=>cb(s.val()),e=>{atwShowError('Database read blocked on "'+p+'": '+(e&&e.message||e)+' — publish the rules from database.rules.json');S.ready=true;render(true)})},
    set(p,v){return v==null?d.remove(d.ref(db,p)):d.set(d.ref(db,p),v)},
    async get(p){return (await d.get(d.ref(db,p))).val()},
    // photos & audio go over plain HTTPS (REST): fast, and works on networks that block live connections
    async blobGet(p){const r=await fetch(`${cfg.databaseURL.replace(/\/$/,'')}/${p}.json`);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()},
    async blobSet(p,v){const {auth}=await loadAuth();const u=auth.currentUser;if(!u)throw new Error('permission: not signed in');
      const tok=await u.getIdToken();const r=await fetch(`${cfg.databaseURL.replace(/\/$/,'')}/${p}.json?auth=${encodeURIComponent(tok)}`,{method:v==null?'DELETE':'PUT',body:v==null?undefined:JSON.stringify(v)});
      if(!r.ok){const t=await r.text().catch(()=>'');throw new Error((r.status===401||r.status===403?'permission ':'')+'HTTP '+r.status+' '+t.slice(0,120))}},
    loadAuth,
    async signIn(email,pw){const {a,auth}=await loadAuth();return a.signInWithEmailAndPassword(auth,email,pw)},
    async signOut(){const {a,auth}=await loadAuth();lsSet('atw-admin',null);return a.signOut(auth)}
  };
}
async function wb(p,v){try{S.err=null;await api.blobSet(p,v)}catch(e){
  S.err=/permission/i.test(String(e&&e.message))?'Not saved: sign in to the Control room again, then retry.':'The file could not be uploaded ('+(e&&e.message||'network error')+'). Check the connection and try again.';render(true);throw e}}
async function w(p,v){try{S.err=null;await api.set(p,v)}catch(e){
  S.err=/permission/i.test(String(e&&e.message))?'Not saved: only signed-in organisers can change the setup.':'Could not save. Check the connection and try again.';render(true);throw e}}

/* ================= derived ================= */
function rotation(start){const n=S.countries.length;if(!n)return[];const st=(((+start||0)%n)+n)%n;return S.countries.map((_,i)=>S.countries[(st+i)%n])}
function route(team){const ids=arr(team.route);
  if(ids.length){const byId=Object.fromEntries(S.countries.map(c=>[c.id,c]));const seen=new Set();const r=[];
    ids.forEach(id=>{if(byId[id]&&!seen.has(id)){seen.add(id);r.push(byId[id])}});S.countries.forEach(c=>{if(!seen.has(c.id))r.push(c)});return r}
  return rotation(team.start)}
function prog(id){const p=S.progress[id]||{};return{step:p.step||0,phase:p.phase||'flyer',stamps:arr(p.stamps),wrong:p.wrong||0,hints:arr(p.hints),finishedAt:p.finishedAt||null}}
function score(id){const p=prog(id),c=S.config;return p.stamps.reduce((a,s)=>a+(+s.points||0),0)-p.hints.length*(+c.hintCost||0)-p.wrong*(+c.wrongPenalty||0)}
function ranked(){return S.teams.map(t=>{const p=prog(t.id);const last=p.stamps.length?p.stamps.at(-1).at:Infinity;return{t,p,score:score(t.id),last}})
  .sort((a,b)=>b.score-a.score||b.p.stamps.length-a.p.stamps.length||a.last-b.last)}
function statusOf(t){const p=prog(t.id),r=route(t),n=r.length;
  if(!n)return{chip:'idle',txt:'No countries',where:'—'};
  if(p.step>=n)return{chip:'done',txt:'Finished',where:'Home'};
  const c=r[p.step];return p.phase==='travel'?{chip:'station',txt:'At station',where:`${c.flag||''} ${c.name}`}:{chip:'solve',txt:'Solving flyer',where:`Flyer ${p.step+1}`}}
const saveProg=(id,p)=>w(`progress/${id}`,p);

/* images: loaded on demand, cached per version */
const normImgs=v=>typeof v==='string'?[v]:arr(v).filter(x=>typeof x==='string'&&x);
function imgFor(c){if(!c||!c.imgV)return null;const k=c.id+'@'+c.imgV;
  if(IMG[k]===undefined){IMG[k]='loading';mediaGet('images/'+c.id,c.imgV).then(v=>{IMG[k]=normImgs(v);render(true)}).catch(()=>{IMG[k]=[];render(true)})}
  return IMG[k]}
const OV={}; // overlay offsets per country, in % of the sheet size
function ovStart(){const r=()=>(Math.random()<.5?-1:1)*(10+Math.random()*12);return{x:r(),y:r(),op:.9}}
const ovAligned=o=>Math.abs(o.x)<.01&&Math.abs(o.y)<.01;
/* ===== audio clue (stored at images/a_<countryId>, loaded only when that flyer is open) ===== */
const AUD={};
/* photos & audio are saved on the phone after the first download (per version),
   so reloads and re-opened flyers cost nothing from the free Firebase allowance */
async function mediaGet(path,ver){const key='https://atw.media/'+path+'?v='+ver;let cache=null;
  try{cache=await caches.open('atw-media-v1');const hit=await cache.match(key);if(hit)return await hit.json()}catch(_){}
  const v=await api.blobGet(path);
  try{if(cache&&v!=null){await cache.put(key,new Response(JSON.stringify(v),{headers:{'Content-Type':'application/json'}}));
    const ks=await cache.keys();for(const r of ks){const u=new URL(r.url);if(u.pathname==='/'+path&&u.search!=='?v='+ver)cache.delete(r)}}}catch(_){}
  return v}
function audFor(c){if(!c||!c.audV)return null;const k=c.id+'@'+c.audV;
  if(AUD[k]===undefined){AUD[k]='loading';mediaGet('images/a_'+c.id,c.audV).then(async v=>{
      if(!v){AUD[k]='';render(true);return}
      try{const bl=await (await fetch(v)).blob();AUD[k]=URL.createObjectURL(bl)}catch(_){AUD[k]=v}render(true)}).catch(()=>{AUD[k]='';render(true)})}
  return AUD[k]}
function audioHTML(c){const src=audFor(c);if(src===null||src==='')return'';
  if(src==='loading')return `<div class="audiobox"><span class="ab-ic">🎧</span><span class="muted">Loading the music…</span></div>`;
  return `<div class="audiobox"><span class="ab-ic">🎧</span><div style="flex:1;min-width:0"><b>Listen to the clue</b><audio id="aud-${esc(c.id)}" controls preload="auto" playsinline src="${src}"></audio></div></div>`}
function readAudio(file){return new Promise((res,rej)=>{if(file.size>2.5*1024*1024){rej(new Error('big'));return}
  if(file.type&&!/^audio\//.test(file.type)&&!/\.(mp3|m4a|aac|wav|ogg)$/i.test(file.name)){rej(new Error('type'));return}
  const fr=new FileReader();fr.onerror=rej;fr.onload=()=>res({data:fr.result,name:file.name,size:file.size});fr.readAsDataURL(file)})}
/* ===== tap-to-cross letter grid ===== */
function gridRows(c){return String(c.grid||'').split(/\n+/).map(r=>r.trim().toUpperCase().split(/[\s,]+/).filter(Boolean)).filter(r=>r.length)}
function gridKey(c){return 'atw-grid-'+(S.myTeam||'x')+'-'+c.id}
function gridState(c){try{return JSON.parse(lsGet(gridKey(c))||'[]')}catch(_){return[]}}
function gridHTML(c){const rows=gridRows(c);if(!rows.length)return'';const x=new Set(gridState(c));let left=[];
  const cells=rows.map((r,ri)=>`<div class="grow-r" style="grid-template-columns:repeat(${r.length},1fr)">${r.map((L,ci)=>{const k=ri+'-'+ci,on=x.has(k);if(!on)left.push(L);
    return `<button type="button" class="gcell${on?' x':''}" data-act="gcell" data-c="${esc(c.id)}" data-k="${k}" aria-pressed="${on}" aria-label="${esc(L)}${on?' crossed out':''}">${esc(L)}</button>`}).join('')}</div>`).join('');
  return `<div class="gridbox"><span class="label">Tap a letter to cross it out · tap again to undo</span><div class="lgrid">${cells}</div>
    <div class="spread"><span class="muted" style="font-size:13px">Letters left: <b class="gleft">${x.size?esc(left.join(' ')):'—'}</b></span><button type="button" class="btn small" data-act="gclear" data-c="${esc(c.id)}">Clear</button></div></div>`}
function photoHTML(c){const im=imgFor(c);if(im===null)return'';
  if(im==='loading')return `<div class="photo loading">Loading photo…</div>`;
  if(!im.length)return'';const k=c.id+'@'+c.imgV;
  if(c.overlay&&im.length>=2){const o=OV[c.id]||(OV[c.id]=ovStart());const al=ovAligned(o);
    return `<div class="overlay${o.full?' ovfull':''}"><div class="ovstage${al?' aligned':''}" id="ovstage"><img src="${im[0]}" alt="Sheet 1"><img class="ovtop" id="ovtop" data-c="${esc(c.id)}" src="${im[1]}" alt="Transparent sheet, drag to line up" style="opacity:${o.op};transform:translate(${o.x}%,${o.y}%)"></div>
      <div class="row"><label for="ov-op" class="label" style="white-space:nowrap">Transparent sheet</label><input id="ov-op" data-c="${esc(c.id)}" type="range" min="0.3" max="1" step="0.05" value="${o.op}" style="flex:1;padding:0"><button type="button" class="btn small" data-act="ovreset" data-id="${esc(c.id)}">Shuffle</button><button type="button" class="btn small primary" data-act="ovfull" data-id="${esc(c.id)}">${o.full?'Close':'⤢ Full screen'}</button></div>
      <span class="muted ovmsg" id="ovmsg" style="font-size:13px">${al?'✅ Lined up! Read the letters under the dots, top to bottom.':'Drag the transparent dots sheet (all dots move together) until it sits exactly on the text.'}</span>
      ${im.slice(2).map((src,i)=>`<button type="button" class="photo" data-act="zoom" data-k="${esc(k)}" data-i="${i+2}"><img src="${src}" alt="Photo clue ${i+3}"><span>Tap to enlarge</span></button>`).join('')}</div>`}
  return `<div class="photos">${im.map((src,i)=>`<button type="button" class="photo" data-act="zoom" data-k="${esc(k)}" data-i="${i}"><img src="${src}" alt="Photo clue ${i+1}"><span>Tap to enlarge</span></button>`).join('')}</div>`}
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('bad image'));im.onload=()=>{
  const max=1000;let{width:w0,height:h0}=im;const s=Math.min(1,max/Math.max(w0,h0));const cv=document.createElement('canvas');cv.width=Math.round(w0*s);cv.height=Math.round(h0*s);
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);

function eqTokens(str){const out=[];for(const ch of String(str||'').toUpperCase()){if(/[A-Z]/.test(ch))out.push({l:ch});else if(/[×X*·]/.test(ch))out.push({o:'×'});else if(ch==='+')out.push({o:'+'});else if(ch==='-'||ch==='−')out.push({o:'−'});else if(ch==='÷'||ch==='/')out.push({o:'÷'});else if(ch==='('||ch===')')out.push({o:ch})}
  // note: x / X / * are read as the multiply sign
  return out}
function eqParts(){const c=S.config;return{res:c.eqResult||'',top:eqTokens(c.eqTop),bot:eqTokens(c.eqBottom),after:eqTokens(c.eqAfter)}}
function eqLetters(){const e=eqParts();return [...e.top,...e.bot,...e.after].filter(t=>t.l).map(t=>t.l)}
function teamLetters(t){const p=prog(t.id),byId=Object.fromEntries(S.countries.map(c=>[c.id,c]));
  return p.stamps.map(s=>({l:(s.letter||((byId[s.countryId]||{}).letter)||'').toUpperCase(),c:byId[s.countryId]})).filter(x=>x.l)}

const isWords=()=>S.config.rewardMode==='words';
function teamWords(t){const p=prog(t.id),byId=Object.fromEntries(S.countries.map(c=>[c.id,c]));
  return p.stamps.map(s=>({w:((byId[s.countryId]||{}).word||'').trim(),c:byId[s.countryId]})).filter(x=>x.w)}

  const won=new Set(teamWords(t).map(x=>x.c&&x.c.id));const got=list.filter(c=>won.has(c.id)).length;
  return `<section class="panel eqp"><div class="spread"><div><span class="label">Collect them all</span><h3>${esc(S.config.wordsTitle||DEF.wordsTitle)}</h3></div>${got===list.length?'<span class="eq-done">Complete</span>':`<span class="label">${got} / ${list.length}</span>`}</div>
    <div class="vals">${list.map(c=>won.has(c.id)?`<div class="val${S.justStamped===c.id?' flip':''}"><span class="vf">${esc(c.flag||'')}</span><span>${esc(c.word)}</span></div>`:`<div class="val empty-v" aria-label="not unlocked yet">${'<i></i>'.repeat(Math.max(2,Math.min(4,c.word.trim().split(/\s+/).length)))}</div>`).join('')}</div>

async function cardPNG(t){const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const load=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src});
  x.fillStyle='#F3F6F8';x.fillRect(0,0,W,H);

  x.fillStyle='#fff';x.beginPath();x.roundRect(60,60,W-120,H-120,36);x.fill();
  x.fillStyle=t.color||'#085271';x.fillRect(60,60,W-120,22);
  const cs=clientLogo();

  if(cs){try{const c=await load(cs);const bh=110,bw=Math.min(330,bh*c.width/c.height),hh=bw*c.height/c.width;x.fillStyle='#D6DEE6';x.fillRect(585,130,2,130);x.drawImage(c,615+(330-bw)/2,195-hh/2,bw,hh)}catch(_){}}
  x.fillStyle='#566778';x.font='600 30px "IBM Plex Mono", monospace';x.textAlign='center';x.fillText('BOARDING PASS',W/2,300);
  x.fillStyle='#085271';x.font='72px Anton, Impact, "Arial Narrow", sans-serif';x.fillText(String(t.name).toUpperCase(),W/2,400);
  const q=window.qrcode(0,'M');q.addData(teamURL(t));q.make();const n=q.getModuleCount(),size=560,cell=size/n,ox=(W-size)/2,oy=450;
  x.fillStyle='#fff';x.fillRect(ox-20,oy-20,size+40,size+40);x.fillStyle='#0B2A3A';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(ox+c*cell,oy+r*cell,Math.ceil(cell),Math.ceil(cell));
  x.fillStyle='#566778';x.font='600 30px "IBM Plex Mono", monospace';x.fillText('TEAM PIN',W/2,1100);

  return await new Promise(r=>cv.toBlob(r,'image/png'))}

  const T=S.teams.length,need=n?Math.ceil(T/n):0,minSets=n?Math.min(...S.countries.map(c=>Math.max(1,+c.sets||1))):0;

  const capNote=!n?'':!short.length?`<div class="flash good">${T} teams · ${n} countries → each country needs ${need} game set${need>1?'s':''}. You have enough: this setup runs up to ${n*minSets} teams with no waiting.</div>`

  const anyClash=grid.some((r,ti)=>r.some((_,i)=>clash(ti,i)));
  const tracks=`<section class="panel"><div class="spread"><div><span class="label">Tracking sheet</span><h2>Team tracks</h2></div>

      <select id="g-allsets" name="sets">${[1,2,3,4,5,6,7,8,9].map(k=>`<option value="${k}"${k===minSets&&S.countries.every(c=>Math.max(1,+c.sets||1)===k)?' selected':''}>${k} set${k>1?'s':''}</option>`).join('')}</select></div>
      <button class="btn primary">Apply to all ${n} countries</button><span class="muted" style="font-size:13px">Then press Auto-arrange. You can still change one country on its own.</span></form>`:''}
    ${capNote}
    ${n&&S.teams.length?`<div class="tbl"><table class="tracks"><thead><tr><th>Team</th>${S.countries.map((_,i)=>`<th>Stop ${i+1}</th>`).join('')}</tr></thead><tbody>
    ${S.teams.map((t,ti)=>{const p=prog(t.id);return `<tr><td><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="dot" style="background:${esc(t.color)}"></span><b>${esc(t.name)}</b></span></td>
      ${grid[ti].map((cid,i)=>`<td class="${i<p.step?'done':i===p.step&&p.step<n?'cur':''}${clash(ti,i)?' clash':''}"><select id="tr-${t.id}-${i}" data-track="${t.id}" data-i="${i}" aria-label="${esc(t.name)} stop ${i+1}">${S.countries.map(c=>`<option value="${c.id}"${c.id===cid?' selected':''}>${esc(c.flag||'')} ${esc(c.name)}</option>`).join('')}</select></td>`).join('')}</tr>`}).join('')}</tbody></table></div>
    <div class="note">Each row is the order a team visits the countries; the team sees the flyer clue for each stop in this order. ${anyClash?'<b style="color:var(--stamp)">Red cells: more teams at that country and stop than it has game sets.</b> Change one, add sets, or use Auto-arrange.':'No clashes: at every stop, no country has more teams than game sets.'} Green = done, orange = current. Change tracks before the game starts.</div>`
    :`<p class="muted">Add countries and teams first.</p>`}</section>`;
  const cfg=S.config;
  const settings=`<section class="panel"><div><span class="label">Rules</span><h2>Game settings</h2></div>
    <form data-form="config" class="grid2"><div class="field"><label for="g-title">Game title</label><input id="g-title" name="title" value="${esc(cfg.title)}"></div>
    <div class="field"><label for="g-hint">Hint costs (pts)</label><input id="g-hint" name="hintCost" type="number" min="0" value="${esc(cfg.hintCost)}"></div>
    <div class="field"><label for="g-wrong">Wrong guess costs (pts)</label><input id="g-wrong" name="wrongPenalty" type="number" min="0" value="${esc(cfg.wrongPenalty)}"></div>
    <div class="field" style="grid-column:1/-1"><label>Client branding for this event</label>
      <div class="row">${clientLogo()?`<img src="${clientLogo()}" alt="Client logo" style="height:56px;max-width:180px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px">`:'<span class="muted">No client logo</span>'}
        <input id="g-logo" type="file" accept="image/*" style="flex:1 1 200px">${S.config.clientLogoV?'<button type="button" class="btn small danger" data-act="rmlogo">Remove logo</button>':''}</div>
      <span class="muted" style="font-size:13px">Shows in the header, check-in screen, leaderboard, finish screen and team cards. PNG with transparent background looks best.</span></div>
    <div class="field"><label for="g-cname">Client name (optional, shown in the header)</label><input id="g-cname" name="clientName" value="${esc(cfg.clientName||'')}" placeholder="e.g. Mars"></div>
    <div class="field"><label for="g-bcol">Client colour for main buttons</label><div class="row"><input id="g-bcol" name="brandColor" type="color" value="${esc(cfg.brandColor||'#E4572E')}" style="height:44px;padding:4px;width:80px"><button type="button" class="btn small" data-act="resetcol">Logic default</button></div></div>
    <div class="field" style="grid-column:1/-1"><label for="g-final">Message when a team finishes all countries</label><input id="g-final" name="finalMessage" value="${esc(cfg.finalMessage||DEF.finalMessage)}"></div>
    <div class="field" style="grid-column:1/-1"><label for="g-mode">What teams collect at each station</label>
      <select id="g-mode" name="rewardMode"><option value="letters"${!isWords()?' selected':''}>Equation letters (default)</option><option value="words"${isWords()?' selected':''}>Custom values / phrases (one per country)</option></select></div>

    <div class="field"><label for="g-eqr">Equation result</label><input id="g-eqr" name="eqResult" value="${esc(cfg.eqResult)}" placeholder="TW"></div>
    <div class="field"><label for="g-eqt">Top line (letters and × + −)</label><input id="g-eqt" name="eqTop" value="${esc(cfg.eqTop)}" placeholder="C × C × C"></div>
    <div class="field"><label for="g-eqb">Bottom line (leave empty for no fraction)</label><input id="g-eqb" name="eqBottom" value="${esc(cfg.eqBottom)}" placeholder="L + V"></div>
    <div class="field"><label for="g-eqa">After the fraction</label><input id="g-eqa" name="eqAfter" value="${esc(cfg.eqAfter)}" placeholder="× U"></div>
    <div class="field" style="align-self:end"><button class="btn primary">Save settings</button></div></form>
    ${isWords()?wordsCheckHTML():eqCheckHTML()}
    <form data-form="bulkwords" class="note" style="display:grid;gap:8px"><b>Values for this event (paste once)</b>
      <span class="muted" style="font-size:13px">One per line: <code>Country = Value</code> or <code>Value (Country)</code>. Saves the value on each country and switches to custom mode.</span>
      <textarea id="g-bulk" name="bulk" rows="6" style="font-family:var(--mono);font-size:13px" placeholder="Spain = Deal With Integrity&#10;France = Customers Come First">${esc(S.countries.filter(c=>c.word).map(c=>c.name+' = '+c.word).join('\n'))}</textarea>
      <div class="row"><button class="btn primary">Apply values</button><button type="button" class="btn" data-act="usewords" data-s="letters">Back to equation letters</button></div></form>
    <div class="spread note"><span>Clear every stamp and score before a new event. Countries and teams stay.</span>${armBtn('reset-all','resetall','Reset all progress')}</div>
    <div class="spread note"><span><b>Logic starter pack:</b> the standard countries with their clues (grid, codes, cuisine, transparent sheet, music), station games, stamp codes and 8 teams with tracks. Uploaded audio is kept. Replaces the current countries, teams and progress.</span>${armBtn('starter','starter','Load starter pack')}</div></section>`;
  const join=`<section class="panel"><div class="spread"><div><span class="label">Boarding</span><h2>Team join link</h2></div>${S.mode==='live'?`<button class="btn small" data-act="logout">Sign out ${esc(S.user&&S.user.email||'')}</button>`:''}</div>
    <div class="qrbox"><div id="qr"></div><div style="display:grid;gap:8px;min-width:0;flex:1 1 220px"><span class="muted">Teams scan this, pick their team and enter their PIN. No account needed.</span><code>${esc(joinURL())}</code><div><button class="btn small" data-act="copy">Copy link</button></div></div></div>
    ${S.teams.length?`<div class="spread note"><span><b>Team cards:</b> one QR per team with its name and PIN. Scanning it logs the team straight in. Print them, save as PDF, or send each card on WhatsApp.</span><button class="btn primary" data-act="view" data-v="cards">Open team cards</button></div>`:''}</section>`;
  return `<section class="panel"><div class="spread"><div><span class="label">Live operations</span><h2>Control room</h2></div><button class="btn small" data-act="view" data-v="board">Open leaderboard</button></div>${sessbar}${boardbar}${live}</section>${join}${tracks}${countries}${teams}${settings}`;
}

function flash(k,m){S.flash={k,m};clearTimeout(flash.t);flash.t=setTimeout(()=>{S.flash=null;render(true)},3500)}
async function doStamp(t,c,pts,by){const p=prog(t.id);const n=route(t).length;
  const letter=String(c.letter||'').toUpperCase().slice(0,1);
  p.stamps=[...p.stamps.filter(s=>s.countryId!==c.id),{countryId:c.id,points:pts,at:Date.now(),by,letter}];p.step=p.step+1;p.phase='flyer';
  if(by==='station'&&(isWords()?(c.word||'').trim():letter))showReveal(c,letter,pts);
  if(p.step>=n)p.finishedAt=Date.now();S.justStamped=c.id;setTimeout(()=>{S.justStamped=null},1200);await saveProg(t.id,p)}

document.addEventListener('change',async e=>{
  if(e.target.dataset&&e.target.dataset.track){const tid=e.target.dataset.track;const t=S.teams.find(x=>x.id===tid);if(!t)return;
    const r=route(t).map(c=>c.id);const i=+e.target.dataset.i,nv=e.target.value,j=r.indexOf(nv);if(j>-1)r[j]=r[i];r[i]=nv;
    try{await w(`teams/${tid}/route`,r)}catch(_){}return}
  if(e.target.id==='g-logo'&&e.target.files.length){try{const d=await logoPNG(e.target.files[0]);await wb('images/clientlogo',d);const v=Date.now();await w('config/clientLogoV',v);CLOGO={k:'logo@'+v,src:d};flash('good','Client logo saved. The app is now branded.')}catch(err){flash('bad','That file could not be used as a logo. Try a PNG or JPG.')}render(true);return}
  if(e.target.id==='c-audio'&&e.target.files.length){try{S.pendingAud=await readAudio(e.target.files[0]);S.err=null}catch(err){S.err=err&&err.message==='big'?'That audio file is bigger than 2.5 MB. Trim it to a 20–40 second clip (or export as MP3 at 128 kbps) and try again.':'That file could not be read as audio.'}render(true);return}
  if(e.target.id!=='c-photo'||!e.target.files.length)return;
  const base=curImgs(editingCountry());if(base==='loading')return;const list=[...base];
  try{for(const f of [...e.target.files]){if(list.length>=4)break;list.push(await compress(f))}S.pendingImg=list;S.err=null;render(true)}
  catch(err){S.err='One file could not be read as a photo. Use JPG or PNG.';render(true)}
});
document.getElementById('zoom').addEventListener('click',()=>{document.getElementById('zoom').hidden=true});

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a!=='arm')S.armed=null;
  try{
  if(a==='view'){document.getElementById('reveal').hidden=true;S.view=b.dataset.v;if((S.view==='control'||S.view==='cards')&&api&&api.loadAuth)api.loadAuth();lsSet('atw-view',S.view);S.flash=null;history.replaceState(null,'','#'+S.view);render();return}
  if(a==='zoom'){const l=IMG[b.dataset.k],src=Array.isArray(l)?l[+b.dataset.i]:null;if(src){document.getElementById('zoomimg').src=src;document.getElementById('zoom').hidden=false}return}
  if(a==='pick'){S.pick=id;S.flash=null;render();setTimeout(()=>document.getElementById('j-pin')?.focus(),0);return}
  if(a==='leave'){S.myTeam=null;S.pick=null;lsSet('atw-team',null);render();return}
  if(a==='arm'){S.armed=b.dataset.key;render(true);return}
  if(a==='edit'){S.editing=b.dataset.e;S.pendingImg=undefined;S.pendingAud=undefined;render();return}
  if(a==='cancel'){S.editing=null;S.pendingImg=undefined;S.pendingAud=undefined;render();return}
  if(a==='gcell'||a==='gclear'){const c=S.countries.find(x=>x.id===b.dataset.c);if(!c)return;let st=new Set(gridState(c));
    if(a==='gclear')st=new Set();else{const k=b.dataset.k;st.has(k)?st.delete(k):st.add(k)}lsSet(gridKey(c),JSON.stringify([...st]));render(true);return}
  if(a==='rmaud'){S.pendingAud=null;render(true);return}
  if(a==='rmimg'){const base=curImgs(editingCountry());if(base==='loading')return;S.pendingImg=base.filter((_,i)=>i!==+b.dataset.i);render(true);return}
  if(a==='ovreset'){const f=OV[id]&&OV[id].full;OV[id]=ovStart();OV[id].full=f;render(true);return}
  if(a==='ovfull'){const o=OV[id];if(o){o.full=!o.full;render(true)}return}
  if(a==='copy'){try{await navigator.clipboard.writeText(joinURL());flash('good','Link copied.')}catch(err){flash('bad','Copy failed. Select the link and copy it.')}render(true);return}
  if(a==='logout'){await api.signOut();return}
  if(a==='install'){if(installEvt){installEvt.prompt();try{const c=await installEvt.userChoice;if(c&&c.outcome==='accepted')lsSet('atw-installed','1')}catch(_){}installEvt=null;render(true)}else showInstallGuide();return}
  if(a==='guidedone'){lsSet('atw-installed','1');document.getElementById('guide').hidden=true;render(true);return}
  if(a==='closereveal'){document.getElementById('reveal').hidden=true;return}
  if(a==='guideclose'){document.getElementById('guide').hidden=true;return}
  if(a==='sample'){await loadSample();flash('good','Example countries and teams loaded.');render();return}
  if(a==='starter'){S.busy=true;flash('good','Loading starter pack…');render(true);try{await loadStarter();flash('good','Starter pack loaded: countries, 8 teams and tracks set. Uploaded audio was kept.')}catch(err){S.err='Starter pack could not be loaded: '+(err&&err.message||err)}S.busy=false;render(true);return}
  if(a==='autotrack'){const {routes,bad}=scheduleTracks();for(let k=0;k<S.teams.length;k++){await w(`teams/${S.teams[k].id}/route`,routes[k])}
    flash(bad?'bad':'good',bad?'Arranged as well as possible, but there are not enough game sets: add sets to remove the red cells.':'Tracks arranged: no country ever has more teams than game sets.');render(true);return}
  if(a==='csv'){const head=['Team','PIN',...S.countries.map((_,i)=>'Stop '+(i+1))];const rows=S.teams.map(t=>[t.name,t.pin,...route(t).map(c=>c.name)]);
    const csv=[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));const l=document.createElement('a');l.href=url;l.download='ATW-team-tracks.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);return}
  if(a==='hint'){const t=S.teams.find(x=>x.id===S.myTeam);if(!t)return;const p=prog(t.id),c=route(t)[p.step];if(!c||p.hints.includes(c.id))return;
    p.hints=[...p.hints,c.id];await saveProg(t.id,p);return}
  if(a==='opstamp'){const t=S.teams.find(x=>x.id===id);const p=prog(id),c=route(t)[p.step];if(!c)return;await doStamp(t,c,+c.points||0,'operator');return}
  if(a==='undo'){const p=prog(id);
    if(p.phase==='travel'){p.phase='flyer'}else if(p.stamps.length){p.stamps=p.stamps.slice(0,-1);p.step=Math.max(0,p.step-1);p.phase='travel';p.finishedAt=null}
    await saveProg(id,p);return}
  if(a==='resetteam'){await w(`progress/${id}`,null);render(true);return}
  if(a==='usewords'){await w('config/rewardMode',b.dataset.s);flash('good',b.dataset.s==='words'?'Custom values on.':'Back to equation letters.');render(true);return}
  if(a==='rmlogo'){await wb('images/clientlogo',null);await w('config/clientLogoV',null);CLOGO=null;flash('good','Client logo removed.');render(true);return}
  if(a==='resetcol'){await w('config/brandColor','');flash('good','Logic colours restored.');render(true);return}
  if(a==='printcards'){window.print();return}

  if(a==='sendcard'){const t=S.teams.find(x=>x.id===id);if(!t)return;const blob=await cardPNG(t);const file=new File([blob],`${t.name.replace(/[^\w-]+/g,'_')}-boarding-pass.png`,{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:cardText(t),title:t.name});return}}catch(e){if(e&&e.name==='AbortError')return}
    const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=file.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);flash('good',`${t.name} card downloaded.`);render(true);return}
  if(a==='board'){await w('config/hideBoard',b.dataset.s==='hide');flash('good',b.dataset.s==='hide'?'Leaderboard hidden from teams and the projector.':'Leaderboard is visible again.');render(true);return}
  if(a==='sess'){await setSession(b.dataset.s);flash('good',b.dataset.s==='live'?'Session started: teams now see their first flyer.':'Session paused.');render(true);return}
  if(a==='resetall'){await w('progress',null);await setSession('waiting');flash('good','All progress cleared.');render(true);return}
  if(a==='delcountry'){await w(`countries/${id}`,null);await wb(`images/${id}`,null);await wb(`images/a_${id}`,null);render(true);return}
  if(a==='delteam'){await w(`teams/${id}`,null);await w(`progress/${id}`,null);render(true);return}

    const A=S.countries[i],B=S.countries[j];await w(`countries/${A.id}/order`,j);await w(`countries/${B.id}/order`,i);
    for(let k=0;k<S.countries.length;k++){const c=S.countries[k];if(k!==i&&k!==j&&c.order!==k)await w(`countries/${c.id}/order`,k)}return}
  }catch(err){}
});

document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f).entries());const kind=f.dataset.form;
  try{
  if(kind==='login'){try{await api.signIn(d.email.trim(),d.pw);S.flash=null;render()}catch(err){flash('bad','Email or password is wrong.');render(true)}return}
  if(kind==='join'){const t=S.teams.find(x=>x.id===S.pick);if(!t)return;
    if(String(d.pin).trim()===String(t.pin).trim()){S.myTeam=t.id;lsSet('atw-team',t.id);S.flash=null;render()}else{flash('bad','That PIN does not match. Ask your organiser.');render(true)}return}
  if(kind==='answer'&&!isLive())return;
  if(kind==='answer'){const t=S.teams.find(x=>x.id===S.myTeam);const p=prog(t.id),c=route(t)[p.step];if(!c||!d.ans.trim())return;
    const list=[c.name,...String(c.answers||'').split(',')].map(norm).filter(Boolean);
    const ok=list.includes(norm(d.ans));
    if(ok){p.phase='travel';flash('good',`Correct. Your shipment is going to ${c.name}.`)}else{p.wrong=p.wrong+1;flash('bad',`Customs rejected "${d.ans.trim()}" (−${+S.config.wrongPenalty||0} pts). Look at the flyer again.`)}
    render();try{await saveProg(t.id,p)}catch(_){}
    setTimeout(()=>{const el=document.getElementById('inline-flash');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},60);return}
  if(kind==='stamp'){const t=S.teams.find(x=>x.id===S.myTeam);const p=prog(t.id),c=route(t)[p.step];if(!c)return;
    if(String(d.code).trim()!==String(c.stampCode||'').trim()){flash('bad','Wrong stamp code. Only the station operator should enter it.');render(true);return}
    const pts=Math.max(0,Math.min(+c.points||0,Math.round(+d.pts||0)));flash('good',`Stamped: ${c.name}, +${pts} points${c.letter?` and the ${isWords()?'value':'letter'} ${isWords()?(c.word||''):String(c.letter).toUpperCase()}`:''}.`);await doStamp(t,c,pts,'station');return}
  if(kind==='country'){const id=f.dataset.id||rid();const old=S.countries.find(c=>c.id===id)||{};
    const hasImg=S.pendingImg!==undefined?S.pendingImg.length>0:!!old.imgV;
    const hasAud=S.pendingAud!==undefined?!!S.pendingAud:!!old.audV;
    if(!d.clue.trim()&&!hasImg&&!hasAud&&!String(d.grid||'').trim()){S.err='Add a clue text, a photo or an audio clip so teams have something to solve.';render(true);return}
    S.busy=true;S.err=null;render(true);
    let imgV=old.imgV||null;
    if(S.pendingImg!==undefined){if(S.pendingImg.length){await wb(`images/${id}`,S.pendingImg);imgV=Date.now();IMG[id+'@'+imgV]=S.pendingImg}else{await wb(`images/${id}`,null);imgV=null}}
    let audV=old.audV||null;
    if(S.pendingAud!==undefined){if(S.pendingAud){S.busyMsg='Uploading audio ('+(S.pendingAud.size/1048576).toFixed(1)+' MB)…';render(true);await wb(`images/a_${id}`,S.pendingAud.data);audV=Date.now();AUD[id+'@'+audV]=S.pendingAud.data}else{await wb(`images/a_${id}`,null);audV=null}}
    const order=old.id?(old.order??S.countries.indexOf(old)):S.countries.length;
    await w(`countries/${id}`,{name:d.name.trim(),flag:d.flag.trim(),code:d.code.trim().toUpperCase(),points:Math.max(0,+d.points||0),clue:d.clue.trim(),answers:d.answers.trim(),hint:d.hint.trim(),challenge:d.challenge.trim(),stampCode:d.stampCode.trim(),color:d.color,letter:String(d.letter||'').trim().toUpperCase().slice(0,1),word:String(d.word||'').trim(),sets:Math.max(1,Math.min(20,Math.round(+d.sets||1))),order,imgV,imgN:hasImg?(S.pendingImg!==undefined?S.pendingImg.length:(old.imgN||1)):0,overlay:!!d.overlay,audV,grid:String(d.grid||'').trim()});
    S.busy=false;S.busyMsg='';S.editing=null;S.pendingImg=undefined;S.pendingAud=undefined;flash('good',`${d.name.trim()} saved${hasAud?' with audio':''}.`);render();return}
  if(kind==='team'){const id=f.dataset.id||rid();const old=S.teams.find(t=>t.id===id);const st=+d.start||0;
    const keep=old&&(+old.start||0)===st&&arr(old.route).length?arr(old.route):rotation(st).map(c=>c.id);
    await w(`teams/${id}`,{name:d.name.trim(),pin:d.pin.trim(),start:st,route:keep,color:d.color,created:(old||{}).created||Date.now()});S.editing=null;render();return}
  if(kind==='bulkwords'){const norm2=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\u0600-\u06ff]/g,'');
    const lines=String(d.bulk||'').split(/\n+/).map(l=>{const m=l.match(/^\s*(.+?)\s*\(([^)]+)\)\s*$/);return m?[m[2],m[1]]:l.split(/=|:|\t/)}).filter(x=>x.length>=2);let ok=0,bad=[];
    for(const [cn,...rest] of lines){const val=rest.join(' ').trim();const c=S.countries.find(x=>norm2(x.name)===norm2(cn)||norm2(x.code)===norm2(cn));
      if(c&&val){await w(`countries/${c.id}/word`,val);ok++}else bad.push(cn.trim())}
    await w('config/rewardMode','words');
    flash(bad.length?'bad':'good',`${ok} values saved, custom mode on.${bad.length?' Not matched: '+bad.join(', '):''}`);render(true);return}
  if(kind==='quickteams'){const N=Math.max(1,Math.min(60,Math.round(+d.n||0)));
    if(S.teams.length&&S.armed!=='qt'){S.armed='qt';flash('bad',`Press the button again to replace all ${S.teams.length} teams with ${N} new teams.`);render(true);return}
    S.armed=null;S.busy=true;render(true);
    for(const t of S.teams){await w(`teams/${t.id}`,null);await w(`progress/${t.id}`,null)}
    const used=new Set(),ver=Date.now();
    for(let k=0;k<N;k++){let pin;do{pin=String(1000+Math.floor(Math.random()*9000))}while(used.has(pin));used.add(pin);
      await w(`teams/t${k+1}`,{name:`Team ${k+1}`,pin,color:QCOL[k%QCOL.length],start:k%Math.max(1,S.countries.length),created:ver+k})}
    await new Promise(r=>setTimeout(r,300));
    if(S.countries.length){const {routes}=scheduleTracks();for(let k=0;k<S.teams.length;k++)await w(`teams/${S.teams[k].id}/route`,routes[k])}
    S.busy=false;flash('good',`${N} teams created with PINs and tracks. Download the sheet (CSV) to print the PINs.`);render(true);return}
  if(kind==='allsets'){const k=Math.max(1,Math.min(9,+d.sets||1));for(const c of S.countries){await w(`countries/${c.id}/sets`,k)}
    flash('good',`All ${S.countries.length} countries set to ${k} game set${k>1?'s':''}. Press Auto-arrange to update the tracks.`);render(true);return}
  if(kind==='config'){await w('config',{session:S.config.session||null,hideBoard:!!S.config.hideBoard,title:d.title.trim()||DEF.title,hintCost:Math.max(0,+d.hintCost||0),wrongPenalty:Math.max(0,+d.wrongPenalty||0),eqResult:d.eqResult.trim(),eqTop:d.eqTop.trim(),eqBottom:d.eqBottom.trim(),eqAfter:d.eqAfter.trim(),rewardMode:d.rewardMode==='words'?'words':'letters',clientName:(d.clientName||'').trim(),brandColor:(d.brandColor&&d.brandColor.toLowerCase()!=='#e4572e')?d.brandColor:'',clientLogoV:S.config.clientLogoV||null,wordsTitle:(d.wordsTitle||'').trim()||DEF.wordsTitle,finalMessage:(d.finalMessage||'').trim()||DEF.finalMessage});flash('good','Settings saved.');render(true);return}
  }catch(err){S.busy=false;S.busyMsg='';render(true)}
});

const QCOL=['#E8590C','#1C7ED6','#2B8A3E','#AE3EC9','#C92A2A','#0C8599','#E67700','#5F3DC4','#D6336C','#2F9E44','#1971C2','#F08C00','#862E9C','#0B7285','#A61E4D','#364FC7'];
/* track scheduler: every team visits every country once; per stop, teams at a country <= its game sets */
function scheduleTracks(){
  const C=S.countries,n=C.length,T=S.teams.length,cap=C.map(c=>Math.max(1,+c.sets||1));
  let best=null,bestBad=Infinity;
  for(let attempt=0;attempt<400&&bestBad>0;attempt++){
    const routes=Array.from({length:T},()=>[]),seen=Array.from({length:T},()=>new Set());let bad=0;
    for(let r=0;r<n;r++){
      const occ=C.map(()=>[]),assign=new Array(T).fill(-1);
      const cand=ti=>{const l=[];for(let k=0;k<n;k++){const ci=(ti+r+k)%n;if(!seen[ti].has(ci))l.push(ci)}if(attempt)l.sort(()=>Math.random()-.5);return l};
      const aug=(ti,vis)=>{for(const ci of cand(ti)){if(vis.has(ci))continue;vis.add(ci);
        if(occ[ci].length<cap[ci]){occ[ci].push(ti);assign[ti]=ci;return true}
        for(const o of [...occ[ci]]){if(aug(o,vis)){occ[ci].splice(occ[ci].indexOf(o),1);occ[ci].push(ti);assign[ti]=ci;return true}}}return false};
      let order=[...Array(T).keys()];if(attempt)order.sort(()=>Math.random()-.5);
      order.sort((a,b)=>(n-seen[a].size)-(n-seen[b].size));
      for(const ti of order)aug(ti,new Set());
      for(let ti=0;ti<T;ti++){if(assign[ti]<0){const left=cand(ti);const ci=left.sort((a,b)=>occ[a].length/cap[a]-occ[b].length/cap[b])[0];occ[ci].push(ti);assign[ti]=ci;bad++}
        routes[ti].push(C[assign[ti]].id);seen[ti].add(assign[ti])}
    }
    if(bad<bestBad){bestBad=bad;best=routes}
  }
  return{routes:best||S.teams.map((_,k)=>rotation(k%n).map(c=>c.id)),bad:bestBad};
}

/* Logic starter pack (starter-pack.json next to index.html) */
async function loadStarter(){
  const res=await fetch('starter-pack.json?v='+Date.now());if(!res.ok)throw new Error('starter-pack.json not found next to index.html');
  const P=await res.json();
  const keepAud=Object.fromEntries(S.countries.filter(c=>c.audV).map(c=>[c.id,c.audV]));
  const packIds=new Set(P.countries.map(c=>c.id));
  for(const c of S.countries){await wb(`images/${c.id}`,null);if(!packIds.has(c.id))await wb(`images/a_${c.id}`,null)}
  await w('progress',null);await w('countries',null);await w('teams',null);
  const ver=Date.now();
  for(let i=0;i<P.countries.length;i++){const c=P.countries[i];const imgs=(c.photos||[]).map(k=>P.photos[k]).filter(Boolean);
    if(imgs.length)await wb(`images/${c.id}`,imgs);
    await w(`countries/${c.id}`,{name:c.name,flag:c.flag,code:c.code,points:c.points||100,clue:c.clue||'',answers:c.answers||'',hint:c.hint||'',challenge:c.challenge||'',stampCode:c.stampCode,color:c.color,letter:c.letter||'',sets:c.sets||1,order:i,imgV:imgs.length?ver:null,imgN:imgs.length,overlay:!!c.overlay,grid:c.grid||'',audV:keepAud[c.id]||null})}
  const ids=P.countries.map(c=>c.id),n=ids.length;
  for(let k=0;k<P.teams.length;k++){const t=P.teams[k];await w(`teams/${t.id}`,{name:t.name,pin:t.pin,color:t.color,start:k%n,route:ids.map((_,i)=>ids[(k+i)%n]),created:ver+k})}
  if(P.config)await w('config',{...DEF,...P.config,clientLogoV:S.config.clientLogoV||null,clientName:S.config.clientName||'',brandColor:S.config.brandColor||'',hideBoard:!!S.config.hideBoard});
}

/* ================= boot ================= */
function subscribe(){
  api.sub('countries',v=>{S.countries=Object.entries(v||{}).map(([id,c])=>({id,...c})).sort((a,b)=>(a.order??0)-(b.order??0));S.ready=true;render(true)});
  api.sub('teams',v=>{S.teams=Object.entries(v||{}).map(([id,t])=>({id,...t})).sort((a,b)=>(a.created||0)-(b.created||0));
    if(S.qrJoin){const t=S.teams.find(x=>x.id===S.qrJoin.team);if(t){if(String(t.pin)===String(S.qrJoin.pin)){S.myTeam=t.id;lsSet('atw-team',t.id);S.view='play';flash('good',`Welcome, ${t.name}! You are checked in.`)}else{S.pick=t.id;S.view='play'}S.qrJoin=null}}
    render(true)});
  api.sub('progress',v=>{S.progress=v||{};render(true)});
  api.sub('config',v=>{const was=isLive();S.config={...DEF,...(v||{})};
    if(!was&&isLive()&&S.myTeam&&S.view!=='control'){flash('good','The game has started! Here is your first shipment.');S.view='play';try{navigator.vibrate&&navigator.vibrate(200)}catch(_){}}
    render(true)});
}
async function boot(){
  const v=lsGet('atw-view');if(v)S.view=v;
  const h=(location.hash||'').slice(1);if(['play','eq','board','control','cards'].includes(h))S.view=h;
  try{const q=new URLSearchParams(location.search);if(q.get('team')){S.qrJoin={team:q.get('team'),pin:q.get('pin')||''};S.view='play';history.replaceState(null,'',location.pathname+'#play')}}catch(_){}
  render();
  const cfg=window.ATW_CONFIG||{};
  if(!window.ATW_CONFIG)atwShowError('config.js loaded but has no settings (window.ATW_CONFIG missing). Replace its content with the app version.');
  if(cfg.apiKey&&cfg.databaseURL){
    try{api=await firebaseApi(cfg);S.mode='connecting'}catch(e){atwShowError('Firebase library failed to load: '+(e&&e.message||e));S.err='Could not reach Firebase. Check your internet connection.';api=demoApi();S.mode='demo';S.canEdit=true}
    setTimeout(()=>{if(S.mode!=='live')atwShowError('Still not connected to the Firebase database after 25 s. Check the internet connection, then reload.')},25000);
  }else{api=demoApi();S.mode='demo';S.canEdit=true}
  subscribe();setTimeout(()=>{S.ready=true;render(true)},4000);
}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
