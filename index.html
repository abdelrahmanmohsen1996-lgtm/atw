<script>
/* on-screen error report + small polyfill for older phones */
if(!Array.prototype.at){Array.prototype.at=function(i){i=Math.trunc(i)||0;if(i<0)i+=this.length;return this[i]}}
window.ATW_ERRORS=[];
function atwShowError(msg){window.ATW_ERRORS.push(msg);var b=document.getElementById('atw-diag');if(!b){b=document.createElement('div');b.id='atw-diag';b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#B42340;color:#fff;font:13px/1.4 monospace;padding:10px 12px;border-radius:10px;white-space:pre-wrap;max-height:40vh;overflow:auto';(document.body||document.documentElement).appendChild(b)}b.textContent='Problem found (send a screenshot of this):\n'+window.ATW_ERRORS.join('\n')}
window.addEventListener('error',function(e){if(e.target&&e.target!==window)return;if(!e.message||/^Script error\.?$/i.test(e.message))return;if(e.filename&&e.filename.indexOf(location.origin)!==0)return;atwShowError((e.message||'Error')+(e.filename?' @ '+e.filename.split('/').pop()+':'+e.lineno:''))},true);
window.addEventListener('unhandledrejection',function(e){atwShowError('Promise: '+(e.reason&&(e.reason.code||e.reason.message)||e.reason))});

<style>
/* Layout: Logic "Around the World" — watercolor world map behind a light sticky header with the ATW wordmark; one working column of white cards; flyer = shipping label, passport = stamp grid */
:root{
  --paper:#F3F6F8; --card:#FFFFFF; --ink:#0B2A3A; --muted:#566778; --line:#D6DEE6; --soft:#F2F5F8;
  --navy:#085271; --navy-ink:#FFFFFF; --accent:#E4572E; --accent-ink:#FFFFFF; --stamp:#C0392B; --ok:#1E9E4A; --warn:#C27C0E;
  --logic:#064A36; --logic-hi:#1EB44B; --bar:rgba(255,255,255,.88);
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper) url(assets/map.jpg) center top/cover fixed no-repeat;color:var(--ink);min-height:100vh;font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:20px}
header.top{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(8,82,113,.06)}
.topin{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{margin-right:auto;display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand .gname{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;line-height:1.3;max-width:16ch}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
nav.tabs button:hover{border-color:var(--navy)}
nav.tabs button[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.mode{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--muted)}
.mode i{width:8px;height:8px;border-radius:50%;background:#7C879C;display:inline-block}
.mode.live i{background:var(--logic-hi);box-shadow:0 0 0 3px rgba(30,180,75,.22)}
.mode.demo i{background:#F59F00}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:30px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;color:var(--navy)}
h3{font-size:16px;font-weight:700}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--stamp)}
.btn.danger.armed{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input[type=file]{padding:8px}
textarea{resize:vertical;min-height:84px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.flash{border-radius:10px;padding:10px 14px;font-weight:600}
.flash.bad{background:color-mix(in srgb,var(--stamp) 14%,transparent);color:var(--stamp)}
.flash.good{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.shake,.stamp-in{animation:none!important}}
.teamcard{box-shadow:0 8px 24px rgba(8,82,113,.06);display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
.teamname{font-family:var(--display);font-weight:400;font-size:28px;text-transform:uppercase;line-height:1;margin-right:auto}
.stat{display:grid;text-align:right}
.stat b{font-family:var(--display);font-size:30px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.flyer{position:relative;background:var(--card);box-shadow:0 10px 30px rgba(8,82,113,.12);border:2px solid var(--navy);border-radius:6px;overflow:hidden}
.flyer .band{background:var(--navy);color:var(--accent-ink);display:flex;justify-content:space-between;gap:10px;padding:8px 16px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;flex-wrap:wrap}
.flyer .body{padding:20px 18px;display:grid;gap:16px}
.flyer .clue{font-size:21px;line-height:1.45;font-weight:500;max-width:62ch;white-space:pre-wrap;overflow-wrap:anywhere}
.flyer .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));border-top:2px solid var(--navy)}
.flyer .meta div{padding:8px 16px;border-right:1px solid var(--line);display:grid}
.flyer .meta div:last-child{border-right:0}
.flyer .meta b{font-family:var(--mono);font-size:14px}
.photo{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft);cursor:zoom-in;position:relative}
.photo img{display:block;width:100%;max-height:60vh;object-fit:contain}
.photo span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px}
.photo.loading{min-height:180px;display:grid;place-items:center;color:var(--muted);cursor:default}
.overlay{display:grid;gap:8px}
.ovstage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none}
.ovstage img{display:block;width:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.ovstage img.ovtop{position:absolute;inset:0;mix-blend-mode:multiply;cursor:grab;pointer-events:auto;touch-action:none}
.photos{display:grid;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;display:grid;gap:4px;justify-items:start}
.thumb{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(5,9,18,.92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.barcode{height:38px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px);opacity:.85;border-radius:2px}
.hint{border-left:3px solid var(--warn);padding:6px 12px;background:var(--soft);border-radius:0 8px 8px 0}
.passport{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.slot{aspect-ratio:1/1;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:8px;background:var(--soft)}
.slot.next{border-color:var(--accent);border-width:2px}
.slot .q{font-family:var(--display);font-size:38px;color:var(--line);font-weight:400}
.stampmark{width:86%;aspect-ratio:1/1;border:3px solid var(--sc,var(--stamp));border-radius:50%;color:var(--sc,var(--stamp));display:grid;place-content:center;gap:1px;transform:rotate(var(--rot,-8deg));box-shadow:inset 0 0 0 4px var(--soft),inset 0 0 0 5.5px var(--sc,var(--stamp))}
.stampmark .flag{font-size:24px;line-height:1}
.stampmark .code{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.06em;line-height:1}
.stampmark .date{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em}
.stampmark .pts{font-family:var(--mono);font-size:10px;font-weight:600}
.stamp-in{animation:thump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes thump{0%{transform:scale(1.8) rotate(var(--rot,-8deg));opacity:0}100%{transform:scale(1) rotate(var(--rot,-8deg));opacity:1}}
.board{display:grid;gap:10px}
.lb{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.lb.first{border:2px solid var(--accent)}
.lb .rank{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.lb.first .rank{color:var(--accent)}
.lb .nm{font-family:var(--display);font-weight:400;font-size:26px;text-transform:uppercase;line-height:1.05;display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
.lb .pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.lb .pip{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:12px}
.lb .pip.on{border:1.5px solid var(--stamp);background:color-mix(in srgb,var(--stamp) 10%,transparent)}
.lb .sc{font-family:var(--display);font-weight:400;font-size:42px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.lb .sc small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.tbl{overflow-x:auto}
.tracks td{padding:6px}.tracks select{padding:6px 8px;font-size:13px;min-width:120px}
.tracks td.done select{background:color-mix(in srgb,var(--ok) 16%,var(--soft));border-color:var(--ok)}
.tracks td.cur select{border:2px solid var(--accent)}
.tracks td.clash select{background:color-mix(in srgb,var(--stamp) 16%,var(--soft));border-color:var(--stamp)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.solve{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.station{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.chip.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.idle{background:var(--soft);color:var(--muted)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .fl{font-size:28px;line-height:1}
.item p{margin:2px 0 0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.teampick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.teampick button{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px}
.teampick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.hero{position:relative;display:grid;justify-items:center;text-align:center;gap:6px;padding-top:6px}
.hero img.land{width:min(520px,100%);height:auto;filter:drop-shadow(0 10px 18px rgba(8,82,113,.12))}
.hero img.wordmark{width:min(420px,88%);height:auto;margin-top:-6px}
.hero p{margin:0;color:var(--muted);max-width:46ch}
.prog{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;flex:1 1 100%;order:9}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--logic-hi));border-radius:inherit;transition:width .6s}
.panel{box-shadow:0 1px 2px rgba(11,42,58,.04),0 8px 24px rgba(8,82,113,.06)}
.foot{display:flex;justify-content:center;align-items:center;gap:10px;padding:8px 0 4px;color:var(--muted);font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.foot img{height:26px;width:auto}
.boardhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.boardhead img.wordmark{height:52px;width:auto;max-width:100%}
.boardland{display:block;width:min(560px,100%);margin:6px auto 0;height:auto;opacity:.95}
.lb.first{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 7%,var(--card)),var(--card))}
.lb .medal{font-size:26px;line-height:1}
.install{display:flex;gap:12px;align-items:center;background:var(--card);border:1px dashed var(--navy);border-radius:14px;padding:12px 14px}
.install img{width:44px;height:44px;border-radius:10px;flex:none}
.install p{margin:0;font-size:14px;color:var(--muted)}.install b{color:var(--ink)}
.empty{text-align:center;padding:36px 18px;display:grid;gap:8px;justify-items:center}
.empty .big{font-family:var(--display);font-size:26px;font-weight:400;text-transform:uppercase}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox #qr{background:#fff;padding:10px;border-radius:10px;line-height:0}
.qrbox code{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
@media (max-width:520px){
  .flyer .clue{font-size:18px}
  .lb{grid-template-columns:40px 1fr auto;padding:10px 12px;gap:10px}
  .lb .rank{font-size:30px}.lb .nm{font-size:20px}.lb .sc{font-size:32px}
  .item{grid-template-columns:auto 1fr}.item .acts{grid-column:1/-1;justify-content:flex-start}
}
</style>

<header class="top"><div class="topin">
  <div class="brand"><img src="assets/atw-logo.png" alt="Around the World" width="130" height="34"><span class="gname" id="brand">Logic Events</span></div>
  <nav class="tabs" id="tabs"></nav>
  <span class="mode" id="mode"><i></i>Connecting</span>
</div></header>
<main class="wrap" id="app"></main>
<footer class="foot">Powered by <img src="assets/logic-logo.png" alt="Logic Events" width="73" height="26"></footer>
<div class="zoom" id="zoom" hidden><img id="zoomimg" alt="Clue photo, enlarged"></div>

<script type="module">
const FBV='10.12.2';
const DEF={title:'Around the World',hintCost:20,wrongPenalty:5};
const COLORS=['#E8590C','#1C7ED6','#2B8A3E','#AE3EC9','#C92A2A','#0C8599','#E67700','#5F3DC4'];
const S={countries:[],teams:[],progress:{},config:{...DEF},canEdit:false,mode:'connecting',ready:false,user:null,
  view:'play',myTeam:lsGet('atw-team'),pick:null,flash:null,editing:null,armed:null,justStamped:null,err:null,pendingImg:undefined,busy:false};
const IMG={}; // cache: key id@ver -> dataURL | '' | 'loading'
let api=null;

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9؀-ۿ]/g,'');
const fmtTime=t=>{try{return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
const code3=c=>(c.code||c.name||'???').slice(0,3).toUpperCase();
const arr=v=>Array.isArray(v)?v.filter(x=>x!=null):(v&&typeof v==='object'?Object.values(v):[]);

/* ================= data layer: Firebase or demo ================= */
function demoApi(){
  let store={};try{store=JSON.parse(lsGet('atw-demo')||'{}')}catch(e){}
  const subs=[];
  const at=p=>p.split('/').reduce((o,k)=>o==null?undefined:o[k],store);
  const fire=()=>{lsSet('atw-demo',JSON.stringify(store));subs.forEach(s=>s.cb(clone(at(s.p))))};
  const clone=v=>v==null?null:JSON.parse(JSON.stringify(v));
  return{
    mode:'demo',
    sub(p,cb){const s={p,cb};subs.push(s);cb(clone(at(p)));},
    async set(p,v){const ks=p.split('/');let o=store;ks.slice(0,-1).forEach(k=>{if(typeof o[k]!=='object'||o[k]==null)o[k]={};o=o[k]});
      if(v==null)delete o[ks.at(-1)];else o[ks.at(-1)]=clone(v);fire()},
    async get(p){return clone(at(p))},
    async signIn(){S.user={email:'demo'};S.canEdit=true},async signOut(){}
  };
}
async function firebaseApi(cfg){
  const app=await import('./lib/firebase-app.js');
  const d=await import('./lib/firebase-database.js');
  const a=await import('./lib/firebase-auth.js');
  try{d.forceLongPolling()}catch(e){} // WebSockets are blocked on some networks; long-polling connects instantly
  const fa=app.initializeApp(cfg);const db=d.getDatabase(fa);const auth=a.getAuth(fa);
  a.onAuthStateChanged(auth,u=>{S.user=u?{email:u.email}:null;S.canEdit=!!u;render(true)});
  d.onValue(d.ref(db,'.info/connected'),s=>{S.mode=s.val()?'live':'offline';render(true)});
  return{
    mode:'live',
    sub(p,cb){d.onValue(d.ref(db,p),s=>cb(s.val()),e=>{atwShowError('Database read blocked on "'+p+'": '+(e&&e.message||e)+' — publish the rules from database.rules.json');S.ready=true;render(true)})},
    set(p,v){return v==null?d.remove(d.ref(db,p)):d.set(d.ref(db,p),v)},
    async get(p){return (await d.get(d.ref(db,p))).val()},
    signIn(email,pw){return a.signInWithEmailAndPassword(auth,email,pw)},
    signOut(){return a.signOut(auth)}
  };
}
async function w(p,v){try{S.err=null;await api.set(p,v)}catch(e){

function rotation(start){const n=S.countries.length;if(!n)return[];const st=(((+start||0)%n)+n)%n;return S.countries.map((_,i)=>S.countries[(st+i)%n])}
function route(team){const ids=arr(team.route);
  if(ids.length){const byId=Object.fromEntries(S.countries.map(c=>[c.id,c]));const seen=new Set();const r=[];
    ids.forEach(id=>{if(byId[id]&&!seen.has(id)){seen.add(id);r.push(byId[id])}});S.countries.forEach(c=>{if(!seen.has(c.id))r.push(c)});return r}
  return rotation(team.start)}
function prog(id){const p=S.progress[id]||{};return{step:p.step||0,phase:p.phase||'flyer',stamps:arr(p.stamps),wrong:p.wrong||0,hints:arr(p.hints),finishedAt:p.finishedAt||null}}
function score(id){const p=prog(id),c=S.config;return p.stamps.reduce((a,s)=>a+(+s.points||0),0)-p.hints.length*(+c.hintCost||0)-p.wrong*(+c.wrongPenalty||0)}
function ranked(){return S.teams.map(t=>{const p=prog(t.id);const last=p.stamps.length?p.stamps.at(-1).at:Infinity;return{t,p,score:score(t.id),last}})
  .sort((a,b)=>b.score-a.score||b.p.stamps.length-a.p.stamps.length||a.last-b.last)}
function statusOf(t){const p=prog(t.id),r=route(t),n=r.length;
  if(!n)return{chip:'idle',txt:'No countries',where:'—'};
  if(p.step>=n)return{chip:'done',txt:'Finished',where:'Home'};
  const c=r[p.step];return p.phase==='travel'?{chip:'station',txt:'At station',where:`${c.flag||''} ${c.name}`}:{chip:'solve',txt:'Solving flyer',where:`Flyer ${p.step+1}`}}

function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('bad image'));im.onload=()=>{
  const max=1200;let{width:w0,height:h0}=im;const s=Math.min(1,max/Math.max(w0,h0));const cv=document.createElement('canvas');cv.width=Math.round(w0*s);cv.height=Math.round(h0*s);
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
  let q=.8,out=cv.toDataURL('image/jpeg',q);while(out.length>450000&&q>.4){q-=.1;out=cv.toDataURL('image/jpeg',q)}res(out)};im.src=fr.result};fr.readAsDataURL(file)})}

function render(keep){if(drag&&keep)return;
  const app=document.getElementById('app');let kept=null;
  if(keep){kept={};app.querySelectorAll('input[id],textarea[id],select[id]').forEach(el=>{if(el.type!=='file'&&!el.dataset.track)kept[el.id]=el.value});
    app.querySelectorAll('input[type=checkbox][name]').forEach(el=>kept['__cb_'+el.name]=el.checked);
    const a=document.activeElement;kept.__f=a&&a.id;try{kept.__s=a&&a.selectionStart}catch(e){}}
  document.getElementById('brand').textContent=(S.config.title&&S.config.title!==DEF.title)?S.config.title:'Logic Events';
  document.title=S.config.title||DEF.title;
  const tabs=[['play','Team play'],['board','Leaderboard'],['control','Control room']];
  document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>`<button data-act="view" data-v="${k}" aria-current="${S.view===k}">${l}</button>`).join('');
  const m=document.getElementById('mode');const ML={live:'Live',offline:'Reconnecting',demo:'Demo · this device',connecting:'Connecting'};
  m.className='mode '+(S.mode==='live'?'live':S.mode==='demo'?'demo':'');m.innerHTML=`<i></i>${ML[S.mode]||''}`;

  if(S.mode==='demo'&&S.view==='control')h+=`<div class="note"><b>Demo mode.</b> Everything saves on this device only. Paste your Firebase settings into config.js to make it live for all phones.</div>`;
  h+=S.view==='board'?vBoard():S.view==='control'?vControl():vPlay();
  app.innerHTML=h;
  if(S.view==='control'&&S.canEdit)drawQR();
  if(kept){for(const id in kept){if(id.startsWith('__cb_')){const el=app.querySelector(`input[type=checkbox][name="${id.slice(5)}"]`);if(el)el.checked=kept[id];continue}
      if(id.startsWith('__'))continue;const el=document.getElementById(id);if(el)el.value=kept[id]}

/* track scheduler: every team visits every country once; per stop, teams at a country <= its game sets */
function scheduleTracks(){
  const C=S.countries,n=C.length,T=S.teams.length,cap=C.map(c=>Math.max(1,+c.sets||1));
  let best=null,bestBad=Infinity;
  for(let attempt=0;attempt<400&&bestBad>0;attempt++){
    const routes=Array.from({length:T},()=>[]),seen=Array.from({length:T},()=>new Set());let bad=0;
    for(let r=0;r<n;r++){
      const occ=C.map(()=>[]),assign=new Array(T).fill(-1);
      const cand=ti=>{const l=[];for(let k=0;k<n;k++){const ci=(ti+r+k)%n;if(!seen[ti].has(ci))l.push(ci)}if(attempt)l.sort(()=>Math.random()-.5);return l};
      const aug=(ti,vis)=>{for(const ci of cand(ti)){if(vis.has(ci))continue;vis.add(ci);
        if(occ[ci].length<cap[ci]){occ[ci].push(ti);assign[ti]=ci;return true}
        for(const o of [...occ[ci]]){if(aug(o,vis)){occ[ci].splice(occ[ci].indexOf(o),1);occ[ci].push(ti);assign[ti]=ci;return true}}}return false};
      let order=[...Array(T).keys()];if(attempt)order.sort(()=>Math.random()-.5);
      order.sort((a,b)=>(n-seen[a].size)-(n-seen[b].size));
      for(const ti of order)aug(ti,new Set());
      for(let ti=0;ti<T;ti++){if(assign[ti]<0){const left=cand(ti);const ci=left.sort((a,b)=>occ[a].length/cap[a]-occ[b].length/cap[b])[0];occ[ci].push(ti);assign[ti]=ci;bad++}
        routes[ti].push(C[assign[ti]].id);seen[ti].add(assign[ti])}
    }
    if(bad<bestBad){bestBad=bad;best=routes}
  }
  return{routes:best||S.teams.map((_,k)=>rotation(k%n).map(c=>c.id)),bad:bestBad};
}

/* Logic starter pack (starter-pack.json next to index.html) */
async function loadStarter(){
  const res=await fetch('starter-pack.json?v='+Date.now());if(!res.ok)throw new Error('starter-pack.json not found next to index.html');
  const P=await res.json();
  await w('progress',null);await w('countries',null);await w('teams',null);await w('images',null);
  const ver=Date.now();
  for(let i=0;i<P.countries.length;i++){const c=P.countries[i];const imgs=(c.photos||[]).map(k=>P.photos[k]).filter(Boolean);
    if(imgs.length)await w(`images/${c.id}`,imgs);
    await w(`countries/${c.id}`,{name:c.name,flag:c.flag,code:c.code,points:c.points||100,clue:c.clue||'',answers:c.answers||'',hint:c.hint||'',challenge:c.challenge||'',stampCode:c.stampCode,color:c.color,sets:c.sets||1,order:i,imgV:imgs.length?ver:null,imgN:imgs.length,overlay:!!c.overlay})}
  const ids=P.countries.map(c=>c.id),n=ids.length;
  for(let k=0;k<P.teams.length;k++){const t=P.teams[k];await w(`teams/${t.id}`,{name:t.name,pin:t.pin,color:t.color,start:k%n,route:ids.map((_,i)=>ids[(k+i)%n]),created:ver+k})}
  if(P.config)await w('config',{...DEF,...P.config});
}

/* ================= boot ================= */
function subscribe(){
  api.sub('countries',v=>{S.countries=Object.entries(v||{}).map(([id,c])=>({id,...c})).sort((a,b)=>(a.order??0)-(b.order??0));S.ready=true;render(true)});
  api.sub('teams',v=>{S.teams=Object.entries(v||{}).map(([id,t])=>({id,...t})).sort((a,b)=>(a.created||0)-(b.created||0));render(true)});
  api.sub('progress',v=>{S.progress=v||{};render(true)});
  api.sub('config',v=>{S.config={...DEF,...(v||{})};render(true)});
}
async function boot(){
  const v=lsGet('atw-view');if(v)S.view=v;
  const h=(location.hash||'').slice(1);if(['play','board','control'].includes(h))S.view=h;
  render();
  const cfg=window.ATW_CONFIG||{};
  if(!window.ATW_CONFIG)atwShowError('config.js loaded but has no settings (window.ATW_CONFIG missing). Replace its content with the app version.');
  if(cfg.apiKey&&cfg.databaseURL){
    try{api=await firebaseApi(cfg);S.mode='connecting'}catch(e){atwShowError('Firebase library failed to load: '+(e&&e.message||e));S.err='Could not reach Firebase. Check your internet connection.';api=demoApi();S.mode='demo';S.canEdit=true}
    setTimeout(()=>{if(S.mode!=='live')atwShowError('Still not connected to the Firebase database after 25 s. Check the internet connection, then reload.')},25000);
  }else{api=demoApi();S.mode='demo';S.canEdit=true}
  subscribe();setTimeout(()=>{S.ready=true;render(true)},4000);
}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
